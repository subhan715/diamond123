<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Marble &amp; Granite</title>
<link rel="icon" href="logo.jpg">
<style>
  html, body { margin:0; height:100%; background:#f4f6f8; }
  #page { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #boot { font-family: Arial, sans-serif; padding:40px; color:#555; }
</style>
</head>
<body>
<div id="boot">Loading Diamond Marble &amp; Granite…</div>
<iframe id="page" title="Diamond Marble &amp; Granite" hidden></iframe>
<div id="diag" style="font-family:monospace;font-size:13px;color:#b00;padding:0 40px;white-space:pre-wrap"></div>
<script>
/* on-screen diagnostics: shows what is wrong if the app cannot start */
(function(){
  var d=document.getElementById('diag'), log=function(m){d.textContent+=m+'\n';};
  window.addEventListener('error',function(e){
    if(e.target&&e.target.tagName==='SCRIPT'){log('FILE NOT FOUND / FAILED TO LOAD: '+e.target.getAttribute('src'));}
    else log('JS ERROR: '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')');
  },true);
  window.addEventListener('unhandledrejection',function(e){log('ERROR: '+(e.reason&&e.reason.message||e.reason));});
  setTimeout(function(){
    var boot=document.getElementById('boot');
    if(boot&&!boot.hidden&&boot.textContent.indexOf('Loading')===0){
      var g={nunjucks:typeof nunjucks,initSqlJs:typeof initSqlJs,CONFIG:typeof CONFIG,Py:typeof Py,DB:typeof DB,Templates:typeof Templates};
      log('Still loading after 6s. Loaded parts: '+JSON.stringify(g));
      ['sql-wasm.wasm','base.html','style.css'].forEach(function(f){
        fetch(f).then(function(r){log(f+' -> HTTP '+r.status);}).catch(function(x){log(f+' -> '+x);});
      });
    }
  },6000);
})();
</script>
<script src="nunjucks.min.js"></script>
<script src="sql-wasm.js"></script>
<script src="config.js"></script>
<script src="pyutil.js"></script>
<script src="db.js"></script>
<script src="jinja-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
